<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆瓣Top250 x 你喜欢的电影</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&family=Inter:wght@300;400;600&display=swap');

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #0f172a;
            color: #F1EDE6;
            overflow-x: hidden;
        }

        .serif {
            font-family: 'Noto Serif SC', serif;
        }

        /* 动态背景 */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1B578C;
            opacity: 1;
            z-index: -1;
        }

        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 10s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -20px); }
        }

        /* 卡片玻璃拟态 */
        .glass-panel {
            background: rgba(241, 237, 230, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(241, 237, 230, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* 动画类 */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 选项交互 */
        .option-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:hover {
            background: rgba(165, 184, 208, 0.2);
            border-color: rgba(165, 184, 208, 0.4);
            transform: translateY(-2px);
        }
        .option-card.selected {
            background: rgba(165, 184, 208, 0.3);
            border-color: #A5B8D0;
            box-shadow: 0 0 15px rgba(165, 184, 208, 0.3);
        }

        /* 自定义下拉框样式 */
        .custom-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23A5B8D0' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
        .custom-select option {
            background-color: #0f172a;
            color: #F1EDE6;
        }

        /* 表格样式 */
        .custom-table th {
            background-color: #F1EDE6;
            color: #1B578C;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.85rem;
            padding: 1rem;
        }
        .custom-table td {
            padding: 1rem;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }
        .custom-table tr:hover td {
            background-color: rgba(0, 70, 128, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center selection:bg-[#004680] selection:text-white">

            </div>
        </section>

            "241": { region: "USA", duration: 122, genre: "剧情 犯罪" },
            "242": { region: "USA", duration: 108, genre: "动作 悬疑 惊悚" },
            "243": { region: "USA", duration: 117, genre: "动作 科幻 动画" },
            "244": { region: "Asia_Other", duration: 82, genre: "动作 科幻 动画" },
            "245": { region: "USA", duration: 143, genre: "剧情 惊悚 冒险" },
            "246": { region: "USA", duration: 108, genre: "剧情 爱情 战争" },
            "247": { region: "USA", duration: 127, genre: "剧情 传记 历史" },
            "248": { region: "Asia_Other", duration: 145, genre: "剧情 悬疑 同性" },
            "249": { region: "Europe", duration: 118, genre: "剧情 家庭" },
            "250": { region: "HK_TW", duration: 112, genre: "剧情 悬疑 犯罪" }
        };

        const moviesDB = rawData.map(line => {
            const [rankStr, title, yearStr, score, weights, quote] = line.split('|');
            const rank = parseInt(rankStr);
            const year = parseInt(yearStr);
            
            // 获取增强数据
            const meta = metadata[rankStr] || { region: "Other", duration: 100, genre: "剧情" };

            const [mood, pace, complexity, reality, intensity, era] = weights.split(',').map(Number);
            return { rank, title, year, score, mood, pace, complexity, reality, intensity, era, quote, ...meta };
        });

        // --- 问题数据 ---
        const questions = [
            {
                id: 1,
                text: "此时此刻，你最希望电影带给你什么样的体验？",
                options: [
                    { text: "我想大哭一场，释放出内心的压抑", weights: { mood: 1, intensity: 4 } },
                    { text: "我想逃离现实，进入一个奇幻的梦境", weights: { reality: 10, mood: 7 } },
                    { text: "我想被温暖治愈，重拾对生活的信心", weights: { mood: 10, intensity: 1 } },
                    { text: "我想要挑战智力，体验烧脑解谜的快感", weights: { complexity: 10, pace: 8 } }
                ]
            },
            {
                id: 2,
                text: "你现在有多少精力和耐心？",
                options: [
                    { text: "精力充沛，可以接受快节奏和复杂叙事", weights: { pace: 9, complexity: 8 } },
                    { text: "有点累，想要节奏舒缓、慢慢流淌的故事", weights: { pace: 2, complexity: 3 } },
                    { text: "一般，只要故事好看，节奏不重要", weights: { pace: 5, complexity: 5 } },
                    { text: "非常亢奋，需要感官刺激和动作场面", weights: { pace: 10, intensity: 9 } }
                ]
            },
            {
                id: 3,
                text: "对于结局，你的偏好是？",
                options: [
                    { text: "必须是Happy Ending，生活已经够苦了", weights: { mood: 8 } },
                    { text: "可以接受悲剧，只要它深刻并且合乎逻辑", weights: { mood: 2, complexity: 6 } },
                    { text: "喜欢开放式的结局，留有无尽的回味空间", weights: { complexity: 8, reality: 5 } },
                    { text: "不在乎结局，过程中的精彩跌宕更为重要", weights: { mood: 6, reality: 4 } }
                ]
            },
            {
                id: 4,
                text: "你更倾向于喜欢哪种视觉风格？",
                options: [
                    { text: "朴实无华的写实主义，贴近生活的原貌", weights: { reality: 1 } },
                    { text: "华丽的视觉特效，宏大的科幻或奇幻场景", weights: { reality: 10 } },
                    { text: "独特的导演美学，构图和色彩讲究", weights: { reality: 6, complexity: 6 } },
                    { text: "黑白影像或胶片质感，带有复古的韵味", weights: { era: 1, reality: 2 } }
                ]
            },
            {
                id: 5,
                text: "面对复杂的社会议题或人性的黑暗面，你的态度是？",
                options: [
                    { text: "我想深刻剖析，想直面人性的深渊", weights: { intensity: 8, mood: 2 } },
                    { text: "点到为止即可，不要过于沉重", weights: { intensity: 5, mood: 5 } },
                    { text: "我只想看纯粹的美好，拒绝沉重的话题", weights: { intensity: 1, mood: 9 } },
                    { text: "我喜欢讽刺和荒诞的处理方式", weights: { complexity: 7, mood: 6 } }
                ]
            },
            {
                id: 6,
                text: "你更偏爱哪种类型的叙事结构？",
                options: [
                    { text: "线性叙事，从头到尾清晰明了", weights: { complexity: 2, pace: 5 } },
                    { text: "非线性叙事，需要观众主动拼凑", weights: { complexity: 10, pace: 7 } },
                    { text: "多线并进，多条故事线交织", weights: { complexity: 7, pace: 6 } },
                    { text: "无所谓，只要故事精彩", weights: { complexity: 5, pace: 5 } }
                ]
            },
            {
                id: 7,
                text: "对于电影的“情感基调”，你更倾向于哪一种？",
                options: [
                    { text: "东方美学：克制隐忍，此处无声胜有声", weights: { mood: 4, complexity: 6 } },
                    { text: "戏剧冲突：浓烈奔放，情感张力拉满", weights: { intensity: 9, mood: 5 } },
                    { text: "小确幸：温馨治愈，如春风拂面", weights: { mood: 9, intensity: 2 } },
                    { text: "纪录风格：真实残酷，冷峻直面现实", weights: { reality: 2, mood: 2 } }
                ]
            },
            {
                id: 8,
                text: "你更倾向于选择哪个年代的电影？",
                options: [
                    { text: "经典老片，黑白或彩色时代", weights: { era: 1, complexity: 4 } },
                    { text: "90年代，那是黄金时代", weights: { era: 4, complexity: 5 } },
                    { text: "2000年后，现代技术成熟", weights: { era: 8, complexity: 6 } },
                    { text: "最近几年，新锐导演作品", weights: { era: 10, complexity: 8 } }
                ]
            },
            {
                id: 9,
                text: "关于电影中的“喜剧成分”，你的偏好是？",
                options: [
                    { text: "黑色幽默或讽刺，让人会心一笑", weights: { complexity: 8, mood: 4 } },
                    { text: "轻松愉快，纯粹的开心果", weights: { mood: 10, intensity: 2 } },
                    { text: "不要搞笑，就要严肃深沉", weights: { mood: 2, complexity: 7 } },
                    { text: "无厘头或动作喜剧，热闹就好", weights: { pace: 9, mood: 8 } }
                ]
            },
            {
                id: 10,
                text: "灵魂拷问：你认为一部好电影最重要的是什么？",
                options: [
                    { text: "智力激荡，通过逻辑思考获得满足", weights: { complexity: 10 } },
                    { text: "情感共鸣，能让我看到自己的影子", weights: { mood: 6, intensity: 5 } },
                    { text: "视听盛宴，极致的画面与音效享受", weights: { reality: 10, era: 9 } },
                    { text: "心灵慰藉，给我面对生活的勇气", weights: { mood: 9, reality: 4 } }
                ]
            }
        ];

        // --- 应用逻辑 ---
        const app = {
            currentQuestionIndex: 0,
            userProfile: { mood: 5, pace: 5, complexity: 5, reality: 5, intensity: 5, era: 5 },
            activeMovies: [], 
            sortedMovies: [],
            displayCount: 25, 

            init: function() {
                this.showScreen('welcome-screen');
                this.activeMovies = [...moviesDB]; 
            },

            showScreen: function(screenId) {
                document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
                document.getElementById(screenId).classList.remove('hidden');
                window.scrollTo(0, 0);
            },

            startQuiz: function() {
                // 1. 获取筛选值
                const genreFilter = document.getElementById('filter-genre').value;
                const regionFilter = document.getElementById('filter-region').value;
                const durationFilter = document.getElementById('filter-duration').value;

                // 2. 过滤电影池
                this.activeMovies = moviesDB.filter(movie => {
                    // 类型筛选 (检查电影类型字符串是否包含选中类型)
                    let genreMatch = true;
                    if (genreFilter !== 'all') {
                        genreMatch = movie.genre.includes(genreFilter);
                    }

                    // 地区筛选
                    let regionMatch = true;
                    if (regionFilter !== 'all') {
                        if (regionFilter === 'Asia_Other') regionMatch = (movie.region === 'Asia_Other' || movie.region === 'Other'); 
                        else if (regionFilter === 'Other') regionMatch = movie.region === 'Other'; // 兼容
                        else regionMatch = movie.region === regionFilter;
                    }

                    // 时长筛选
                    let durationMatch = true;
                    if (durationFilter === 'short') durationMatch = movie.duration < 90;
                    else if (durationFilter === 'medium') durationMatch = movie.duration >= 90 && movie.duration <= 120;
                    else if (durationFilter === 'long') durationMatch = movie.duration > 120;

                    return genreMatch && regionMatch && durationMatch;
                });

                if (this.activeMovies.length === 0) {
                    alert("筛选条件太严格了，没有找到符合的电影！请尝试放宽条件。");
                    this.activeMovies = [...moviesDB]; 
                    return; 
                }

                this.currentQuestionIndex = 0;
                this.userProfile = { mood: 5, pace: 5, complexity: 5, reality: 5, intensity: 5, era: 5 };
                this.showScreen('quiz-screen');
                this.renderQuestion();
            },

            renderQuestion: function() {
                const q = questions[this.currentQuestionIndex];
                document.getElementById('q-text').innerText = q.text;
                document.getElementById('q-current').innerText = this.currentQuestionIndex + 1;

                const optionsGrid = document.getElementById('options-grid');
                optionsGrid.innerHTML = '';
                
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('div');
                    btn.className = 'option-card border border-[rgba(241,237,230,0.2)] p-6 rounded-none cursor-pointer transition-all duration-300';
                    btn.innerText = opt.text;
                    btn.onclick = () => this.selectOption(opt.weights);
                    optionsGrid.appendChild(btn);
                });

                const progress = ((this.currentQuestionIndex + 1) / questions.length) * 100;
                document.getElementById('progress-bar').style.width = `${progress}%`;
            },

            selectOption: function(weights) {
                Object.entries(weights).forEach(([key, value]) => {
                    this.userProfile[key] = (this.userProfile[key] + value) / 2;
                });

                this.currentQuestionIndex++;
                if (this.currentQuestionIndex < questions.length) {
                    this.renderQuestion();
                } else {
                    this.showLoading();
                }
            },

            showLoading: function() {
                this.showScreen('loading-screen');
                document.getElementById('filter-count-display').innerText = this.activeMovies.length;
                
                const analysisTexts = [
                    '分析观影性格...',
                    '匹配叙事节奏...',
                    '计算视觉风格...',
                    `正在排序 ${this.activeMovies.length} 部候选电影...`,
                    '生成推荐片单...'
                ];
                let index = 0;
                const interval = setInterval(() => {
                    document.getElementById('analysis-text').innerText = analysisTexts[index];
                    index++;
                    if (index >= analysisTexts.length) {
                        clearInterval(interval);
                        this.calculateMatch();
                    }
                }, 600);
            },

            calculateMatch: function() {
                this.sortedMovies = this.activeMovies.map(movie => {
                    const weights = { mood: 1.5, complexity: 1.2, pace: 1.0, reality: 1.0, intensity: 1.0, era: 0.8 };
                    
                    const moodDiff = Math.pow(movie.mood - this.userProfile.mood, 2) * weights.mood;
                    const paceDiff = Math.pow(movie.pace - this.userProfile.pace, 2) * weights.pace;
                    const complexityDiff = Math.pow(movie.complexity - this.userProfile.complexity, 2) * weights.complexity;
                    const realityDiff = Math.pow(movie.reality - this.userProfile.reality, 2) * weights.reality;
                    const intensityDiff = Math.pow(movie.intensity - this.userProfile.intensity, 2) * weights.intensity;
                    const eraDiff = Math.pow(movie.era - this.userProfile.era, 2) * weights.era;
                    
                    const totalDistance = Math.sqrt(moodDiff + paceDiff + complexityDiff + realityDiff + intensityDiff + eraDiff);
                    
                    let matchScore = 100 - (totalDistance * 4); 
                    if (matchScore < 0) matchScore = 0;
                    
                    return { ...movie, matchScore: matchScore.toFixed(1) };
                }).sort((a, b) => {
                    const scoreDiff = b.matchScore - a.matchScore;
                    if (Math.abs(scoreDiff) > 0.01) return scoreDiff;
                    return a.rank - b.rank;
                });
                
                this.showResult();
            },

            showResult: function() {
                this.showScreen('result-screen');
                this.renderAnalysis();
                this.displayCount = 25;
                this.renderTable();
                document.getElementById('total-filtered-count').innerText = this.activeMovies.length;
            },

            renderAnalysis: function() {
                const p = this.userProfile;
                const tags = [];
                
                if (p.mood >= 7) tags.push('感性驱动');
                else if (p.mood <= 4) tags.push('理性克制');
                
                if (p.complexity >= 7) tags.push('烧脑达人');
                else if (p.complexity <= 4) tags.push('简单直接');
                
                if (p.reality >= 7) tags.push('幻想家');
                else if (p.reality <= 4) tags.push('现实主义');
                
                if (p.era <= 3) tags.push('怀旧经典迷');
                
                const tagsContainer = document.getElementById('analysis-tags');
                tagsContainer.innerHTML = tags.map(tag => 
                    `<span class="px-3 py-1 bg-[rgba(165,184,208,0.2)] text-[#A5B8D0] text-sm rounded-none border border-[rgba(165,184,208,0.3)]">${tag}</span>`
                ).join('');
                
                const genreText = document.getElementById('filter-genre').options[document.getElementById('filter-genre').selectedIndex].text;
                const regionText = document.getElementById('filter-region').options[document.getElementById('filter-region').selectedIndex].text;
                const durationText = document.getElementById('filter-duration').options[document.getElementById('filter-duration').selectedIndex].text;
                
                const content = `在“${genreText} / ${regionText} / ${durationText}”的范围内，基于你的回答，我为你重新排序了这 ${this.activeMovies.length} 部电影。`;
                document.getElementById('analysis-content').innerText = content;
            },

            loadMore: function() {
                this.displayCount += 25;
                if (this.displayCount > this.activeMovies.length) this.displayCount = this.activeMovies.length;
                this.renderTable();
            },

            renderTable: function() {
                const tbody = document.getElementById('movie-table-body');
                tbody.innerHTML = '';
                
                const currentData = this.sortedMovies.slice(0, this.displayCount);
                
                currentData.forEach((movie, index) => {
                    const regionMap = { 
                        'USA': '美国', 'Mainland': '中国大陆', 'HK_TW': '中国港台', 
                        'Europe': '欧洲', 'Asia_Other': '其它', 'Other': '其它' 
                    };
                    const regionStr = regionMap[movie.region] || '其它';

                    const row = document.createElement('tr');
                    row.className = 'border-b border-[rgba(148,163,184,0.1)] hover:bg-[rgba(0,70,128,0.1)] transition-colors';
                    row.innerHTML = `
                        <td class="text-center font-mono text-slate-500">${index + 1}</td>
                        <td class="text-center">
                            <span class="font-bold text-[#F1EDE6]">${movie.matchScore}%</span>
                        </td>
                        <td class="text-center">
                            <span class="px-2 py-0.5 bg-[rgba(255,255,255,0.05)] text-slate-400 text-xs rounded-none">#${movie.rank}</span>
                        </td>
                        <td class="font-medium text-[#F1EDE6] text-base">
                            ${movie.title} <span class="text-slate-500 text-xs ml-1 font-normal">${movie.year}</span>
                        </td>
                        <td class="text-center text-slate-500 text-xs hidden md:table-cell">
                             <div class="mb-1 text-[#A5B8D0]">${movie.genre}</div>
                             <div class="opacity-60">${regionStr} · ${movie.duration}分</div>
                        </td>
                        <td class="hidden lg:table-cell text-slate-400 text-xs italic opacity-80">"${movie.quote}"</td>
                    `;
                    tbody.appendChild(row);
                });
                
                document.getElementById('display-count').innerText = currentData.length;
                
                const loadBtn = document.getElementById('load-more-btn');
                if (this.displayCount >= this.activeMovies.length) {
                    loadBtn.style.display = 'none';
                } else {
                    loadBtn.style.display = 'inline-block';
                }
            }
        };

        app.init();
    </script>
</body>
</html>
